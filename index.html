<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Free Social Media Post Formatter &amp; Hashtag Cleaner | PostCraft</title>
    <meta
      name="description"
      content="Format bold &amp; italic text for LinkedIn &amp; X, fix Instagram line breaks, clean duplicate hashtags, and preview character limits online for free."
    />
    <meta
      name="keywords"
      content="instagram line break generator, linkedin text formatter, bold font generator, twitter character counter, clean hashtags"
    />
    <link rel="canonical" href="https://postcraft.100ideas.net/" />
    <meta name="author" content="PostCraft" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PostCraft" />
    <meta
      property="og:title"
      content="Free Social Media Post Formatter &amp; Hashtag Cleaner | PostCraft"
    />
    <meta
      property="og:description"
      content="Format bold &amp; italic text for LinkedIn &amp; X, fix Instagram line breaks, clean duplicate hashtags, and preview character limits online for free."
    />
    <meta property="og:url" content="https://postcraft.100ideas.net/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PostCraft — Free Social Media Post Formatter" />
    <meta
      name="twitter:description"
      content="Bold &amp; italic text for LinkedIn &amp; X, fix Instagram line breaks, clean hashtags, live character limits. 100% in your browser."
    />
    <meta name="twitter:url" content="https://postcraft.100ideas.net/" />

    <!-- JSON-LD structured data for Google rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PostCraft",
        "url": "https://postcraft.100ideas.net/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Free online social media post formatter, Instagram line break fixer, Unicode bold/italic text generator, and hashtag cleaner. Runs 100% in your browser.",
        "featureList": [
          "Bold, italic, monospace and script Unicode text styling",
          "Instagram line break fixer with invisible characters",
          "Hashtag extractor, deduplicator and sorter",
          "Live character counters for X, Instagram and LinkedIn",
          "Client-side only — no data leaves the browser"
        ]
      }
    </script>

    <script>
      // Apply the stored theme before first paint to avoid a light/dark flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('postcraft:theme')
          var theme = stored
            ? JSON.parse(stored)
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
